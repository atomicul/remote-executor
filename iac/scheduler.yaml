AWSTemplateFormatVersion: '2010-09-09'
Description: 'SNS, SQS, and Lambda infrastructure for async scale-out provisioning'

Parameters:
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing the scale-out Lambda JAR

  LambdaCodeKey:
    Type: String
    Description: S3 key for the scale-out Lambda JAR

  ProvisionerVersion:
    Type: String
    Description: Published version of the provisioner Lambda to point the live alias at

  SubmitterVersion:
    Type: String
    Description: Published version of the submitter Lambda to point the live alias at

Resources:
  ScaleOutTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: remote-executor-scale-out

  SubmitDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: remote-executor-submit-dlq

  SubmitQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: remote-executor-submit
      DelaySeconds: 120
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SubmitDeadLetterQueue.Arn
        maxReceiveCount: 5

  ScaleOutLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScaleOutAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:RunInstances
                  - ec2:DescribeInstances
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RemoteExecutor-JobState'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt SubmitQueue.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt SubmitQueue.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParametersByPath
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/remote-executor/scheduler/*'

  ProvisionerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: remote-executor-provisioner
      Runtime: java21
      Handler: dev.executor.scaleout.ProvisionHandler::handleRequest
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt ScaleOutLambdaRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref SubmitQueue

  ProvisionerAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref ProvisionerFunction
      FunctionVersion: !Ref ProvisionerVersion
      Name: live

  SubmitterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: remote-executor-submitter
      Runtime: java21
      Handler: dev.executor.scaleout.SubmitHandler::handleRequest
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt ScaleOutLambdaRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey

  SubmitterAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref SubmitterFunction
      FunctionVersion: !Ref SubmitterVersion
      Name: live

  ProvisionerSnsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: lambda
      TopicArn: !Ref ScaleOutTopic
      Endpoint: !Ref ProvisionerAlias

  ProvisionerSnsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProvisionerAlias
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref ScaleOutTopic

  SubmitterEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt SubmitQueue.Arn
      FunctionName: !Ref SubmitterAlias
      BatchSize: 1

Outputs:
  ScaleOutTopicArn:
    Value: !Ref ScaleOutTopic
  SubmitQueueUrl:
    Value: !Ref SubmitQueue
